name: CodeQL Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        shell: pwsh
        run: dotnet restore "src/FootballLogoDownloader/FootballLogoDownloader.csproj"

      - name: Build for analysis
        shell: pwsh
        run: dotnet build "src/FootballLogoDownloader/FootballLogoDownloader.csproj" -c Release --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
